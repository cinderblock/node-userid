name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  # Test fixtures, created on Linux and FreeBSD
  LONG_USERNAME_TEST: UsernameWithMoreThan15Chars
  LONG_GROUPNAME_TEST: GroupnameWithMoreThan15Chars
  BIG_ID: 3000000000

jobs:
  checks:
    name: Format, spelling, types, lint, package shape
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: sudo apt-get -o Acquire::Retries=5 install -y clang-tidy
      - run: bun install --frozen-lockfile
      # node-gyp would download these mid-build with no retry; see the script
      - name: Download the Node.js headers
        run: scripts/fetch-node-headers.sh
      - run: bun run build:native
      - run: bun run format:check
      - run: bun run spelling
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check:package

  # Builds from source and runs the tests on every supported Node.js version
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        node: [22, 24, 26]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - run: bun install --frozen-lockfile
      # node-gyp would download these mid-build with no retry; see the script
      - name: Download the Node.js headers
        run: scripts/fetch-node-headers.sh
      - run: bun run build:native

      - name: Create test users and groups
        if: runner.os == 'Linux'
        run: |
          sudo useradd "$LONG_USERNAME_TEST"
          sudo useradd "$LONG_GROUPNAME_TEST"
          sudo groupadd -g "$BIG_ID" biggroupname
          sudo useradd -M -N -g "$BIG_ID" -u "$BIG_ID" biguidusername
          echo "BIG_ID_USERNAME=biguidusername" >> "$GITHUB_ENV"
          echo "BIG_ID_GROUPNAME=biggroupname" >> "$GITHUB_ENV"

      - name: No test users on macOS
        if: runner.os == 'macOS'
        run: |
          echo "LONG_USERNAME_TEST=" >> "$GITHUB_ENV"
          echo "LONG_GROUPNAME_TEST=" >> "$GITHUB_ENV"

      - run: bun run test

      # A getpwnam_r that takes 300 ms, like a slow LDAP server: the sync API must block the event loop, the promise API must not
      - name: Event loop stays free during async lookups
        if: runner.os == 'Linux'
        run: |
          cc -shared -fPIC -o "$RUNNER_TEMP/slow-getpwnam.so" test/fixtures/slow-getpwnam.c -ldl
          LD_PRELOAD="$RUNNER_TEMP/slow-getpwnam.so" USERID_SLOW_LOOKUP_MS=300 node --test test/event-loop.test.mts

  windows:
    name: Windows (installs, every lookup throws)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run test

  freebsd:
    name: FreeBSD (builds from source)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # node-gyp would download these mid-build with no retry; see the script
      - name: Download the Node.js headers
        run: scripts/fetch-node-headers.sh

      # Bun doesn't run on FreeBSD, so this job uses npm. The VM sees the workspace at the same path.
      - name: Build and test in a FreeBSD VM
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          envs: FORCE_COLOR LONG_USERNAME_TEST LONG_GROUPNAME_TEST npm_package_config_node_gyp_tarball
          usesh: true
          prepare: |
            pkg install -y node24 npm-node24 python3 gmake
            pw useradd "$LONG_USERNAME_TEST"
            pw useradd "$LONG_GROUPNAME_TEST"
          run: |
            npm install --no-audit --no-fund
            npm run build:native
            npm test

  prebuild-linux:
    name: Prebuild ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on old distributions (glibc 2.31); scripts/check-prebuilds.sh then checks they need no more than Node.js 22 does.
          # ppc64le and s390x have no node:22-bullseye image: Ubuntu 20.04 (also glibc 2.31) plus the official Node.js tarball.
          - { name: linux-x64-glibc, runner: ubuntu-latest, image: 'node:22-bullseye' }
          - { name: linux-arm64-glibc, runner: ubuntu-24.04-arm, image: 'node:22-bullseye' }
          - { name: linux-armv7-glibc, runner: ubuntu-24.04-arm, image: 'node:22-bullseye', platform: linux/arm/v7 }
          - name: linux-ppc64-glibc
            runner: ubuntu-latest
            image: ubuntu:20.04
            platform: linux/ppc64le
            setup: sh scripts/ci-install-node.sh python3 make g++
          - name: linux-s390x-glibc
            runner: ubuntu-latest
            image: ubuntu:20.04
            platform: linux/s390x
            setup: sh scripts/ci-install-node.sh python3 make g++
          - name: linux-x64-musl
            runner: ubuntu-latest
            image: 'node:22-alpine'
            setup: apk add --no-cache python3 make g++
          - name: linux-arm64-musl
            runner: ubuntu-24.04-arm
            image: 'node:22-alpine'
            setup: apk add --no-cache python3 make g++

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The build tools are plain JavaScript, so install them here and use them inside the container
      - run: bun install --frozen-lockfile --ignore-scripts
      # node-gyp would download these mid-build with no retry; see the script
      - name: Download the Node.js headers
        run: scripts/fetch-node-headers.sh

      - name: Emulate ${{ matrix.platform }}
        if: matrix.platform
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Build in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          SETUP: ${{ matrix.setup }}
        run: |
          docker run --rm ${PLATFORM:+--platform "$PLATFORM"} -v "$PWD:/repo" -w /repo \
            -e npm_package_config_node_gyp_tarball="/repo/${npm_package_config_node_gyp_tarball#"$PWD"/}" \
            "$IMAGE" sh -ec "${SETUP:+$SETUP && }npm run build:native"
          find prebuilds -type f -exec ls -l {} +

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-${{ matrix.name }}
          path: prebuilds/
          if-no-files-found: error

  prebuild-macos:
    name: Prebuild darwin-arm64 + darwin-x64
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile --ignore-scripts
      # node-gyp would download these mid-build with no retry; see the script
      - name: Download the Node.js headers
        run: scripts/fetch-node-headers.sh
      - run: bun run build:native --arch arm64
      - name: Cross-compile x64
        run: bun run build:native --arch x64
      - run: find prebuilds -type f -exec file {} +

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-darwin
          path: prebuilds/
          if-no-files-found: error

  prebuild-freebsd:
    name: Prebuild freebsd-x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile --ignore-scripts
      # node-gyp would download these mid-build with no retry; see the script
      - name: Download the Node.js headers
        run: scripts/fetch-node-headers.sh

      # The VM sees the workspace at the same path
      - name: Build in a FreeBSD VM
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          envs: npm_package_config_node_gyp_tarball
          usesh: true
          prepare: pkg install -y node22 npm-node22 python3 gmake
          run: npm run build:native

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-freebsd-x64
          path: prebuilds/
          if-no-files-found: error

  pack:
    name: Pack with every prebuild
    needs: [prebuild-linux, prebuild-macos, prebuild-freebsd]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuild-*
          path: prebuilds
          merge-multiple: true

      - name: Check the Linux prebuilds' glibc and libstdc++ requirements
        run: scripts/check-prebuilds.sh prebuilds

      - name: Pack
        run: |
          find prebuilds -type f | sort
          npm pack
          tar -tzf userid-*.tgz | sort

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: userid-*.tgz
          if-no-files-found: error

  # Install the packed tarball like a user would, with no compiler involved
  consumer:
    name: Install with ${{ matrix.pm }} on ${{ matrix.os }}
    needs: pack

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
        pm: [npm, pnpm, bun]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: No test users here
        run: |
          echo "LONG_USERNAME_TEST=" >> "$GITHUB_ENV"
          echo "LONG_GROUPNAME_TEST=" >> "$GITHUB_ENV"

      - run: scripts/smoke-test-package.sh userid-*.tgz ${{ matrix.pm }}

  consumer-musl:
    name: Install with npm on Alpine (${{ matrix.runner }})
    needs: pack

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Install and test in node:24-alpine (no compiler in the image)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo -e FORCE_COLOR node:24-alpine \
            sh -ec 'apk add --no-cache bash >/dev/null && scripts/smoke-test-package.sh userid-*.tgz npm'

  consumer-emulated:
    name: Install with npm on ${{ matrix.platform }} (emulated)
    needs: pack

    strategy:
      fail-fast: false
      matrix:
        include:
          # Node.js 24 dropped official 32-bit ARM builds, so test with 22 (our oldest supported line)
          - { platform: linux/arm/v7, runner: ubuntu-24.04-arm, image: 'node:22-bookworm-slim' }
          - { platform: linux/ppc64le, runner: ubuntu-latest, image: 'node:22-bookworm-slim' }
          # There is no Node.js image for s390x
          - platform: linux/s390x
            runner: ubuntu-latest
            image: ubuntu:22.04
            setup: sh scripts/ci-install-node.sh

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Install and test in ${{ matrix.image }} (no compiler in the image)
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/repo" -w /repo -e FORCE_COLOR "$IMAGE" \
            sh -ec "${SETUP:+$SETUP && }bash scripts/smoke-test-package.sh userid-*.tgz npm"
